<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Axiom favicon: SVG adapts to light/dark via prefers-color-scheme; PNG fallbacks for legacy browsers -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" href="/favicon.png" sizes="64x64" type="image/png" />
    <link rel="icon" href="/favicon-dark.png" sizes="64x64" type="image/png" media="(prefers-color-scheme: dark)" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>Axiom</title>
    <meta name="title" content="Axiom" />
    <meta name="description" content="Axiom — modern admin dashboard and AI agent workspace. Clean, fast, and built for production." />
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: dark)" />

    <!-- Canonical -->
    <link rel="canonical" href="https://axiom.example.com/" />

    <!-- Open Graph / Facebook / LinkedIn -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Axiom" />
    <meta property="og:title" content="Axiom" />
    <meta property="og:description" content="Axiom — modern admin dashboard and AI agent workspace." />
    <meta property="og:url" content="/" />
    <meta property="og:image" content="/og-image.png" />
    <meta property="og:image:alt" content="Axiom product preview" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Axiom" />
    <meta name="twitter:description" content="Axiom — modern admin dashboard and AI agent workspace." />
    <meta name="twitter:image" content="/og-image.png" />
    <meta name="twitter:image:alt" content="Axiom product preview" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
